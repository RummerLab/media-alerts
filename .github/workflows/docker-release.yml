name: Docker release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      ref:
        description: 'Existing stable version tag, e.g. v1.2.3'
        required: true
        type: string
  workflow_call:
    inputs:
      ref:
        required: true
        type: string

concurrency:
  group: docker-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      sha: ${{ steps.tag.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Require an existing stable tag on main
        id: tag
        env:
          TAG: ${{ inputs.ref || github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          sha="$(git rev-parse --verify "refs/tags/$TAG^{commit}")"
          git merge-base --is-ancestor "$sha" origin/main
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
  checks:
    needs: tag
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.tag.outputs.sha }}
  images:
    needs: [tag, checks]
    uses: ./.github/workflows/images.yml
    with:
      ref: ${{ needs.tag.outputs.sha }}
      tag: ${{ needs.tag.outputs.tag }}
      publish: true
    permissions:
      contents: read
      packages: write
  publish:
    needs: [tag, images]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.tag.outputs.sha }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Assemble tested multi-platform version
        env:
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ needs.tag.outputs.tag }}
        run: |
          set -euo pipefail
          image="ghcr.io/${REPOSITORY,,}"
          for name in "$image"; do
            docker buildx imagetools create --tag "$name:$TAG" "$name:$TAG-amd64" "$name:$TAG-arm64"
          done
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.tag.outputs.tag }}
        run: gh release view "$TAG" || gh release create "$TAG" --verify-tag --generate-notes
      - name: Check published stable release order
        id: latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.tag.outputs.tag }}
        run: python scripts/dependency_release.py latest --tag "$TAG"
      - name: Advance Watchtower latest tags
        if: steps.latest.outputs.advance_latest == 'true'
        env:
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ needs.tag.outputs.tag }}
        run: |
          set -euo pipefail
          image="ghcr.io/${REPOSITORY,,}"
          for name in "$image"; do
            docker buildx imagetools create --tag "$name:latest" "$name:$TAG"
          done
