name: CI
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_call:
    inputs:
      ref:
        type: string
        default: ''
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - run: pip install uv==0.13.7
      - run: uv pip sync --system --require-hashes --exclude-newer 3d  requirements-dev.lock
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m pytest tests/


  images:
    uses: ./.github/workflows/images.yml
    with:
      ref: ${{ inputs.ref }}
