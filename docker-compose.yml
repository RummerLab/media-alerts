services:
  digest:
    image: ghcr.io/rummerlab/media-alerts:${IMAGE_TAG:-latest}
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    container_name: rummerlab-media-alerts
    # Must own ./data on the host, or seen.json can't be saved and items repeat.
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    env_file:
      - path: .env
        required: false
    environment:
      - TZ=${TZ:-Australia/Brisbane}
      - PYTHONUNBUFFERED=1
    volumes:
      - ./data:/app/data
    restart: unless-stopped
